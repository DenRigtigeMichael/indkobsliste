# better-sqlite3 needs native build tools.
# Tailwind/Next use lightningcss platform binaries (optionalDependencies).
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = [
  "NPM_CONFIG_PRODUCTION=false NPM_CONFIG_OPTIONAL=true npm ci --include=dev --include=optional",
  "npm install --no-save lightningcss-linux-x64-gnu@1.32.0 lightningcss-linux-x64-musl@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.3.3 @tailwindcss/oxide-linux-x64-musl@4.3.3",
  "node -e \"require('lightningcss'); console.log('lightningcss ok')\""
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
